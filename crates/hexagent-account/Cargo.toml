[package]
name = "hexagent-account"
version = "0.1.0"
edition = "2021"
description = "hexagent-sdk: strategy-facing account bookkeeping — order manager, position manager, local orderbook."

[dependencies]
hexagent-types = { path = "../hexagent-types" }
hexagent-runtime = { path = "../hexagent-runtime" }
serde = { version = "1", features = ["derive"] }
# Durable proofs compare immutable numbers across archive/checkpoint/WAL replay.
# The default fast float parser can move an emitted binary64 value by one ULP.
serde_json = { version = "1", features = ["float_roundtrip"] }
fs2 = "0.4"
log = "0.4"
arc-swap = "1"
crossbeam-channel = "0.5"
rusqlite = { version = "0.37", features = ["bundled"] }
