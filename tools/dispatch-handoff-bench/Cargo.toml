[package]
name = "dispatch-handoff-bench"
version = "0.1.0"
edition = "2021"

# Compile the actual queue/wake source in a small standalone probe. It never
# imports an exchange, credentials, or a trading executor.
[workspace]
[[bin]]
name = "admission"
path = "src/bin/admission.rs"
test = false

[[bin]]
name = "wire"
path = "src/bin/wire.rs"
test = false

[dependencies]
crossbeam-channel = "0.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mimalloc = { version = "0.1", default-features = false }
arrayvec = { version = "0.7", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
hex = "0.4"

[dev-dependencies]
rmp-serde = "1"

[profile.release]
codegen-units = 1
lto = "thin"
